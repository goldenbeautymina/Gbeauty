<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>已收到｜皇帝詩命運測驗｜GoldenBeauty</title>
  <meta name="description" content="已收到你的表單資料。回到測驗頁按一下即可顯示結果。" />

  <link rel="stylesheet" href="./assets/gbeauty-ui.css" />

  <style>
    /* 這頁只加很少補丁：置中、更溫馨 */
    .centerWrap{min-height:calc(100vh - 84px);display:flex;align-items:center}
    .successCard{max-width:680px;margin:0 auto}
    .iconOk{
      width:54px;height:54px;border-radius:16px;
      display:grid;place-items:center;
      background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;
      font-weight:900;font-size:26px;
      margin:0 auto 12px;
    }
    .title{margin:0;text-align:center;font-size:22px;line-height:1.4}
    .sub{margin:10px 0 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
    .steps{
      margin-top:14px;
      background:#fff7ed;border:1px solid #fde68a;
      border-radius:14px;padding:12px 12px;
      color:#78350f;font-size:13px;line-height:1.7;
    }
    .steps strong{font-weight:900}
    .actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .actions .btn{width:100%}
    .miniLink{text-align:center;margin-top:10px;font-size:12px;color:var(--muted)}
    .miniLink a{text-decoration:underline;font-weight:800}
  </style>
</head>

<body>
  <!-- ✅ 置頂導覽 -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./index.html" aria-label="回到首頁">
        <img class="brandLogo" src="./images/gbeauty-logo.jpg" alt="GoldenBeauty Logo" />
        <span class="brandText">
          <strong>GoldenBeauty</strong>
          <small>開運眉眼唇・紋繡美學</small>
        </span>
      </a>

      <button class="navBtn" id="navBtn" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>
    </div>

    <nav class="navPanel" id="navPanel">
      <a href="./index.html#service">服務特色</a>
      <a href="./index.html#booking">立即預約</a>
      <a href="./index.html#studio">工作室</a>
      <a href="./vip.html">VIP</a>
    </nav>
  </header>

  <main class="centerWrap">
    <div class="wrap">
      <section class="card successCard cardPad">
        <div class="iconOk">✓</div>

        <h1 class="title">已收到你的資料 🤍</h1>
        <p class="sub">
          接下來，我會把你的皇帝詩答案溫柔地交給你。<br>
          請回到測驗頁，按一下「我已提交，顯示結果」就會揭曉。
        </p>

        <div class="steps">
          <strong>接下來怎麼做：</strong><br>
          1）點下面按鈕回到測驗頁<br>
          2）按「② 我已提交，顯示結果」<br>
          3）結果會在 1.5 秒後出現（有儀式動畫🙂）
        </div>

        <div class="actions">
          <a class="btn primary" href="./emperor-poem-test.html">回到測驗頁看結果</a>
          <a class="btn" href="./index.html#booking">我想順便預約諮詢／施作</a>
          <a class="btn" href="./index.html">回首頁</a>
        </div>

        <div class="miniLink">
          如果你是從 Google 表單頁面回來的：也可以直接點 <a href="./emperor-poem-test.html">這裡回測驗頁</a>
        </div>
      </section>
    </div>
  </main>

  <script>
    // 手機導覽開合
    const navBtn = document.getElementById("navBtn");
    const navPanel = document.getElementById("navPanel");

    navBtn.addEventListener("click", () => {
      const open = navPanel.classList.toggle("open");
      navBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });

    navPanel.querySelectorAll("a").forEach(a => {
      a.addEventListener("click", () => {
        navPanel.classList.remove("open");
        navBtn.setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
</html>
